    <div id="sec_listings">
      <div class="wstoolbar">
        <div><h2 id="ws_title">Listings</h2><div class="sub" id="ws_rowsub"></div></div>
        <span class="spacer"></span>
        <div id="srcswitch" class="mktswitch">
          <button class="mktbtn on" data-src="drafts" onclick="setListSource('drafts')">Drafts</button>
          <button class="mktbtn" data-src="live" onclick="setListSource('live')">Live on Amazon</button>
          <button class="mktbtn" data-src="all" onclick="setListSource('all')">All</button>
          <!-- WHERE DELETED LISTINGS GO.
               They were already kept -- never auto-deleted -- but they were
               hidden from every view, and the only trace was a red line naming
               the first three SKUs. So there was nothing to click and nowhere
               they lived. Asked for as: "i also asked you to give me a button
               where the deleted listings go when they are deleted from amazon
               but they are stored in the app". -->
          <button class="mktbtn" data-src="removed" id="srcbtn_removed"
                  title="Listings this app still holds that Amazon no longer has. Nothing is ever deleted automatically."
                  onclick="setListSource('removed')" style="display:none">Removed</button>
          <!-- WHY THIS EXISTS WHEN THE LABEL BESIDE IT SAYS "synced 4m ago".
               "why do have that sync button if the listings are already been
                synced upto some minutes?"
               Fair question, and the old tooltip ("Sync live listings from
               Amazon now") answered none of it -- it described the button as a
               repeat of something the page appears to do already. It is not.
               Opening the tab shows a SAVED copy and, at most, reuses a report
               Amazon has already built; it never fetches a listing's contents.
               These four things happen ONLY when this is pressed, which is why
               the tooltip now names them instead of saying "sync". -->
          <button class="mktbtn" onclick="syncLive()" title="Not a repeat of the automatic refresh — four things happen only when you press this:&#10;&#10;• Amazon builds a BRAND NEW listings report. Opening this tab reuses the last one, so the list can be right about which listings exist and still be behind on price, stock and status.&#10;• Each listing's actual CONTENTS are pulled — images, A+, bullets, description, variations, and Amazon's own handling time. Nothing else on this screen ever fetches these.&#10;• Drafts you have submitted are checked against Amazon and marked live where Amazon has published them.&#10;• Listings deleted or deactivated on Amazon are settled against what this app holds.&#10;&#10;It takes a few minutes on a large catalogue. The label beside this button says when Amazon was last actually read."><i class="ti ti-refresh"></i> Sync</button>
          <span id="synclabel" class="cc" style="font-size:11px;margin-left:2px"></span>
          <!-- COSTS ▾ -- the sheet, the upload and the explainer behind one
               button. They were three of seventeen toolbar buttons. Clear COGS
               is NOT here: on the owner's redesign it moved to the ⋯ menu,
               with the other rarely-pressed and destructive actions. -->
          <button class="mktbtn" id="costs_btn" onclick="toolbarMenu(event, 'tpl_costs')"
                  title="The cost sheet, uploading it back, and how costs work"><i class="ti ti-coins"></i> Costs <i class="ti ti-chevron-down" style="font-size:10px"></i></button>
          <input type="file" id="cogs_file" accept=".csv,.tsv,.txt,.xlsx,.xlsm,.xls" style="display:none" onchange="cogsUploadFile(this)">
          <!-- THE COSTS ▾ MENU. A <template> is inert until toolbarMenu()
               (genflow.js) copies it into the shared .tilemenu, so the buttons
               stay HTML here -- not strings built in JavaScript -- and each
               still calls exactly the function it always called. The menu
               closes itself on the click that presses an item.
               THE SHEET TO FILL IN comes before the upload that takes it back:
               there was an upload and no template once, so every SKU was typed by
               hand, and a hand-typed SKU silently matches nothing. ONE UPLOAD,
               the one that dry-runs the file and asks first ("uploading the cogs
               sheet should be in the one place, not scattered everywhere"). -->
          <template id="tpl_costs">
            <button onclick="location.href=(typeof acctUrl==='function'?acctUrl('/cogs/template.csv'):'/cogs/template.csv')"
               title="Downloads a sheet listing every SKU on this account, with its ASIN, product name, the cost the app uses now and where that came from. Fill in the 'cost' column for the ones you want to set, and upload it back. Rows you leave blank are not changed."><i class="ti ti-file-download"></i> Cost sheet</button>
            <button onclick="cogsUploadOpen()" title="Upload the cost sheet back — or any CSV or spreadsheet with a sku (or asin) column and a cost column. Shows what it would change and asks before writing. Only rows with a cost filled in are applied."><i class="ti ti-upload"></i> Upload costs</button>
            <button onclick="cogsExplain()" title="Where every cost comes from, which one wins, and how profit is worked out"><i class="ti ti-help-circle"></i> How costs</button>
          </template>
        </div>
        <!-- The marketplace strip used to sit here as well as in the sidebar.
             Two controls for one setting, and the toolbar one was the wider of
             the two on a screen already carrying six other buttons. Removed on
             request: "i already have the marketplace section now at the left
             side of the screen so remove it from the header". Its two
             non-duplicate actions -- set-as-default and detect -- moved into
             the sidebar menu rather than being dropped with it. -->
        <select id="statussel" onchange="setFilterVal(this.value)" title="Filter by status"
          style="background:var(--bg);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:5px 10px;font-size:13px">
          <!-- EVERY FILTER THE TILES CAN SET NEEDS AN OPTION HERE.
               metricFilter() does `sel.value = v` and then applies the filter
               regardless. When there is no matching <option>, the assignment
               silently does nothing and the dropdown goes BLANK while the list
               below it is filtered -- so the control that is supposed to tell
               you what you are looking at stops saying anything. The four
               live_* filters and the two hold halves were all missing. -->
          <option value="all">All statuses</option>
          <!-- THE FOUR STATUSES. Every filter a tile can set needs an option
               here or the dropdown goes blank while the list below it is
               filtered -- see the note below. "warned" is not a status: it is
               "carries at least one warning", which cuts across all four. -->
          <option value="queued">Queued</option>
          <option value="generated">Generated</option>
          <option value="submitted">Submitted</option>
          <option value="warned">— with warnings</option>
          <option value="review">Needs review (old)</option>
          <option value="holds">Blocked or refused</option>
          <option value="blocked">— blocked by our own checks</option>
          <option value="refused">— refused by Amazon</option>
          <option value="approved">Approved</option>
          <option value="live">Live</option>
          <optgroup label="Live on Amazon">
            <option value="live_all">All live listings</option>
            <option value="live_notshowing">Not showing</option>
            <option value="live_nocost">No cost set</option>
            <option value="live_oos">Out of stock</option>
          </optgroup>
        </select>
        <!-- THREE VIEWS, as before the 26 Sep redesign: the owner asked for the
             card view back ("Keep Card view as its own toggle with its own
             features"), and for the detailed row as it was. -->
        <span class="viewtoggle" id="viewtoggle" title="Table or card view — remembered on this browser">
          <button data-view="table" class="on" onclick="setListView('table')" title="Table view"><i class="ti ti-list"></i></button>
          <button data-view="detailed" onclick="setListView('detailed')" title="Detailed view — Amazon's Manage All Inventory layout: performance, inventory and pricing beside each listing"><i class="ti ti-list-details"></i></button>
          <button data-view="grid" onclick="setListView('grid')" title="Card view"><i class="ti ti-layout-grid"></i></button>
        </span>
        <!-- UPLOAD TEMPLATE — opens the generation flow (#genflow) above the
             table. Folded by default; this is the only way it opens, so the
             drafts table keeps the screen until an upload is actually wanted. -->
        <button class="ghost" id="genflow_btn" onclick="genflowToggle()"
                title="Add products to generate: drop a CSV or spreadsheet, or type one in. Opens above the table — the drafts stay in view."><i class="ti ti-upload"></i> Upload template</button>
        <!-- GENERATE, on the page the drafts land on. It was one of six equal
             buttons on a screen you had to navigate to; here it is the one that
             starts a run, and the only one on this toolbar that spends money. -->
        <button class="ghost" onclick="genflowGenerate()"
                title="Generate every queued product that is not already in the app. This is the step that spends AI credit — the queue and the skip count are under Upload template."><i class="ti ti-player-play"></i> Generate</button>
        <!-- THE FIVE DEMOTED RUN ACTIONS, kept rather than deleted.
             Retry holds, Export, Preview, Submit and Stop were a permanent bar
             of six on the generate screen. They are rare — but Preview is the
             only way to check against Amazon without sending, and Stop is the
             only way to end a run, so none of them may be dropped. Behind one
             button, in the same .tilemenu the rows already use. -->
        <button class="ghost" id="genflow_more" onclick="genflowRunMenu(event)"
                title="Fix product types, Diagnose, Paste, Reload list, the run actions (Retry holds, Export, Preview, Submit, Stop) and Clear COGS"><i class="ti ti-dots"></i></button>
        <!-- WHAT THE ⋯ MENU ADDS TO THE RUN ACTIONS. Moved off the toolbar on
             the owner's redesign: occasional tools above the run actions, the
             one destructive action below them. genflowRunMenu() copies these in;
             every button calls the function it called on the toolbar. -->
        <template id="tpl_more_tools">
          <button title="Checks every unsent draft against its competitor ASIN's product type in Amazon's catalogue, shows what would change, and asks before saving anything. Submitted and live listings are not touched." onclick="ptFixDrafts()"><i class="ti ti-category"></i> Fix product types</button>
          <button title="Run a full SP-API health check for this account and marketplace — tests DNS, network, auth, and every SP-API operation in one shot; tells you exactly which layer is broken and how to fix it" onclick="runSpDiagnose()"><i class="ti ti-stethoscope"></i> Diagnose</button>
          <button onclick="openPasteListing()" title="Paste a listing's copy (title, bullets, description) + a main image, then open Image Studio to make secondary images and A+ content — no existing listing needed"><i class="ti ti-clipboard-plus"></i> Paste</button>
          <!-- REFRESH, KEPT HERE rather than deleted. Sync does everything this
               does, but also pulls every listing's full contents from Amazon --
               minutes, and up to 300 calls. This is the light reload: the
               drafts again, and on Live/All a fresh list from Amazon. -->
          <button onclick="refreshView()" title="Reload this workspace's listings, and re-check the live catalog against Amazon when the live view is shown. Lighter than Sync: it does not pull every listing's full contents."><i class="ti ti-refresh"></i> Reload list</button>
        </template>
        <template id="tpl_more_danger">
          <!-- THE WAY BACK OUT of a cost sheet uploaded against the wrong
               account. Destructive, so it is last and red, and it asks first. -->
          <button class="danger cogswipe" title="Delete every cost you have typed or uploaded for this account. Asks first, and says how many. Those products are then left with no cost, so their profit, margin and ROI show blank until a cost is set again." onclick="cogsClearAll()"><i class="ti ti-eraser"></i> Clear COGS</button>
        </template>
      </div>
      <!-- ===== THE GENERATION FLOW, ON THE PAGE THE DRAFTS ARE ON =====
           Upload a template, check the queue, press Generate, watch the
           progress, review the drafts below — without changing screens.

           MOVED here from #sec_generate rather than rewritten (Rule 10). The
           drop zone is still inputupload.js's, the queue is still
           inputqueue.js's, and the pre-flight count is still genplan.js's, so
           every measured behaviour in those three files is untouched. What is
           new is WHERE they sit and that they start folded.

           Folded by default: the drafts table is what this page is for, and a
           drop zone above it every time you open Listings would push the table
           off the screen for the 99 visits out of 100 that are not an upload. -->
      <div id="genflow" class="genflow" hidden>
        <!-- The drop zone. inputupload.js owns the dropping, the validation and
             the error card that names the headers your file actually had. -->
        <div id="inputupload"></div>

        <!-- THE PRODUCT QUEUE — what Generate will make, added and edited here.
             UPLOADS ADD, and that is deliberate: a second file joins the first
             rather than replacing it, so two uploads in a row cannot silently
             bin the first one's rows. Emptying the queue is therefore its own
             visible button rather than a side effect of pressing Upload. -->
        <div id="inputsheetwrap" class="genflow-queue">
          <div class="genflow-qhead">
            <b class="genflow-qtitle"><i class="ti ti-list-check"></i> Products to generate</b>
            <span class="cc genflow-qmeta" id="inputsheet_meta"></span>
            <!-- WHAT GENERATE WOULD DO, BEFORE IT DOES IT — genplan.js, moved
                 into this header rather than deleted. The spec called it clutter
                 and the block it drew was; the numbers are not. They are the
                 only way to see the duplicate check working WITHOUT pressing
                 Generate, and by the time the log says "skipped" the AI spend
                 has already started. It also catches a full queue with nothing
                 on record, which is what a broken duplicate check looks like
                 and is otherwise indistinguishable from a genuine first run. -->
            <div id="genplan" class="genplan genplan-inline"></div>
            <span class="spacer" style="flex:1"></span>
            <input id="inputsheet_filter" class="genflow-filter" placeholder="Filter…"
                   oninput="filterInputSheet()">
            <button class="ib" onclick="inputQueueLoad()"><i class="ti ti-refresh"></i> Refresh</button>
            <button class="ib genflow-clear" onclick="genflowClearQueue()"
                    title="Empty the queue. Asks first, and says how many products it would remove. Nothing that has already been generated is touched.">
              <i class="ti ti-eraser"></i> Clear queue</button>
            <button class="ib genflow-go" onclick="genflowGenerate()"
                    title="Generate every queued product that is not already in the app. This is the step that spends AI credit."><i class="ti ti-player-play"></i> Generate now</button>
          </div>
          <div id="inputsheet_body" class="genflow-qbody">
            <div class="cc" style="padding:16px;opacity:.6">Loading…</div>
          </div>
        </div>
      </div>
      <div id="gridhow"></div>
      <div id="ws_datasrc" class="datasrc"></div>
      <div id="tabfilter" class="tabfilter" style="display:none"></div>
      <div id="selbar" class="selbar" style="display:none">
        <span id="selcount">0 selected</span>
        <span class="spacer"></span>
        <!-- SUBMIT SELECTED — the spec's bulk submit. It calls submitLive(),
             which ALREADY scopes the run to selectedSkus(), already runs the
             local-image precheck, and already makes you confirm the destination
             account by name before anything is sent. So this is a visible way in
             with a live count, not a second submit path (Rule 12) — inventing
             one would be inventing a way to publish to Amazon.
             Styled as the one consequential button in this bar, because it is
             the only one here that reaches the live catalogue. -->
        <button id="selsubmit" class="selsubmit" onclick="submitLive()"
                title="Publish the selected listings to Amazon. Shows the destination account and asks before anything is sent. Listings that are already live are skipped."><i class="ti ti-cloud-upload"></i> Submit selected</button>
        <button onclick="bulkStatus('APPROVED')" title="Approve all selected listings"><i class="ti ti-check"></i> Approve</button>
        <button onclick="bulkStatus('HOLD')" title="Put all selected listings on hold"><i class="ti ti-player-pause"></i> Hold</button>
        <span class="handlingwrap" title="Set the handling time (lead time to ship, in days) on the selected listings — saves it here and pushes the change live to Amazon">
          <i class="ti ti-clock-hour-4"></i>
          <input id="handlingdays" type="number" min="0" max="30" step="1" placeholder="days" class="handlingdays">
          <button id="handlingbtn" onclick="bulkHandling()">Set handling time</button>
        </span>
        <!-- STOCK, beside handling time because they are the same Amazon
             attribute: fulfillment_availability carries the quantity and the
             lead time together, and Amazon replaces the whole thing on a patch.
             Seller-fulfilled only — on an FBA listing the stock is whatever is
             in Amazon's warehouse, which is reported per SKU rather than
             silently failing. -->
        <span class="handlingwrap" title="Set the stock quantity on the selected listings and push it live to Amazon. Seller-fulfilled listings only — FBA stock lives in Amazon's warehouse and cannot be typed in here.">
          <i class="ti ti-package"></i>
          <input id="stockqty" type="number" min="0" step="1" placeholder="units" class="handlingdays">
          <button id="stockbtn" onclick="bulkQuantity()">Set stock</button>
        </span>
        <!-- PRICE BY PERCENTAGE. A percentage is not a price — it is a
             different number on every listing — so this shows what each one
             becomes before anything is sent, and then sends those figures
             rather than the percentage again. -->
        <span class="handlingwrap" title="Raise or lower the selling price of every selected listing by a percentage. You see exactly what each listing becomes before anything is sent.">
          <i class="ti ti-percentage"></i>
          <input id="pricepct" type="number" step="0.5" placeholder="+10 or -5" class="handlingdays" style="width:92px">
          <button id="pricepctbtn" onclick="bulkPricePercent()">Change price %</button>
        </span>
        <button onclick="bulkPreview()" title="Check every selected listing against Amazon in one run. Nothing is sent. Each listing's Amazon warnings are replaced with the new reply; a submitted listing stays Submitted."><i class="ti ti-eye"></i> Preview</button>
        <button onclick="bulkAutoFix()" title="Run Suggest→Apply→Preview loop on every selected listing. Auto-stops per SKU when clean or stuck." style="border-color:var(--accent);color:var(--accent2)"><i class="ti ti-wand"></i> Auto-fix</button>
        <!-- GTIN EXEMPTION, THE ONLY WAY TO CLAIM IT IN BULK.
             The app never claims it on its own: an empty barcode box now sends
             Amazon no identifier at all rather than a silent declaration that
             the product has none. This button and the tick box on a single
             listing are the two deliberate ways in, which is what was asked for
             — "ONLY EXEMPT WHEN USER SELECTS MULTIPLE DRAFTS AND CLICK ON APPLY
             FOR GTIN EXEMPTION OR DO IT INSIDE THE PDP ONE BY ONE". -->
        <button id="gtinexemptbtn" onclick="bulkGtinExemption(true)" title="Declare to Amazon that the selected products have no barcode. Needs GTIN-exemption approval for the brand and category. Nothing is sent now — it is claimed on the next submit."><i class="ti ti-barcode-off"></i> Apply for GTIN exemption</button>
        <!-- The cost upload used to sit here as well as on the toolbar. A price
             list covers the whole account, not the rows that happen to be
             ticked, so a selection bar was never its home -- and having it in
             two places with two different behaviours is what "scattered
             everywhere" meant. It is on the toolbar now, beside the Cost sheet
             it takes back. The per-row way is still to click the COGS cell. -->
        <button onclick="openStudioBatch()" title="Generate main images for all selected products"><i class="ti ti-photo"></i> Generate main images</button>
        <button onclick="batchGenerate('regen')" title="Regenerate the listing copy for the selected SKUs"><i class="ti ti-refresh"></i> Regenerate listings</button>
        <button onclick="batchSecondaryImages()" title="Generate secondary images once and apply to all selected SKUs"><i class="ti ti-photo"></i> Secondary images</button>
        <button onclick="batchAutoGenerate('secondary')" title="Strategist proposes secondary-image ideas and generates them for every selected product — runs in the background, no pop-up" style="border-color:var(--accent)"><i class="ti ti-bolt"></i> Auto-generate (Secondary)</button>
        <button onclick="batchAutoGenerate('aplus')" title="Strategist proposes A+ modules and generates them for every selected product — runs in the background, no pop-up" style="border-color:var(--accent)"><i class="ti ti-bolt"></i> Auto-generate (A+)</button>
        <button onclick="bulkDelete()" title="Delete all selected listings" style="color:var(--red);border-color:var(--red-line)"><i class="ti ti-trash"></i> Delete</button>
        <button onclick="rescanFlags()" title="Re-judge compliance and IP flags on already-generated rows using the current rules. Costs nothing and never touches your copy — only Status, Notes, Compliance Risk and IP Risk, and only on rows that are NEEDS_REVIEW or held." style="border-color:var(--ok);color:var(--ok)"><i class="ti ti-shield-check"></i> Re-check flags</button>
        <button onclick="selectAllVisible(true)">Select all</button>
        <button onclick="clearSelection()">Clear</button>
      </div>
      <div id="summary">Loading…</div>
      <!-- Honest run state. Fed by /run/health (heartbeat file + real process
           liveness), NOT by the log stream below -- a frozen log cannot fake it. -->
      <div id="runhealth" class="runhealth" style="display:none">
        <span id="rh_dot" class="rh_dot"></span>
        <span id="rh_state" class="rh_state">—</span>
        <span id="rh_detail" class="rh_detail"></span>
        <button id="rh_why" class="rh_why" style="display:none"
                onclick="whyStuck()">Why is it stuck?</button>
      </div>
      <!-- The generator's progress, rendered. genui.js fills this while a run
         streams; the <pre> below is the old raw terminal, kept as the fallback
         for when genui.js has not loaded (it is hidden while the panel is in
         use, and the raw text is still available folded inside the panel). -->
    <div id="genui"></div>
    <pre id="log"></pre>
      <!-- Where the "these are samples" bar goes, above the listings rather than
     inside the grid: the grid is rewritten on every render and filter, and a
     warning that disappears when you click a filter is worse than none. -->
<div id="rows_demo"></div>
<main id="grid"><div class="empty">Loading listings…</div></main>
      <div id="drawerscrim" class="drawerscrim" onclick="closeDrawer()"></div>
      <aside id="drawer" class="drawer"><div id="drawerbody"></div></aside>
    </div>
