    <div id="sec_orders" class="wspanel">
      <div class="wstoolbar bleed">
        <!-- FEWER WORDS (owner, 30 Sep 2026: "too much text scattered, less
             words but concise and good visuals"). The explanation is the
             title's hover text; the six sheet actions sit behind Sheets ▾ (the
             app's one toolbar dropdown, genflow.js toolbarMenu). -->
        <div><h2 title="This account's orders, newest first. Click a row to open it."><i class="ti ti-receipt"></i> Orders</h2></div>
        <div style="display:flex;gap:6px;align-items:center;flex-wrap:wrap">
          <input id="ord_q" placeholder="Search orders…" oninput="ordersFilter(this.value)"
                 aria-label="Search orders by number, town or status"
                 style="font-size:12px;padding:5px 9px;min-width:190px">
          <button class="db-chip" onclick="toolbarMenu(event,'tpl_ord_sheets')"
                  title="Download or upload the cost and tracking sheets">
            <i class="ti ti-file-spreadsheet"></i> Sheets <i class="ti ti-chevron-down"></i></button>
          <template id="tpl_ord_sheets">
            <button onclick="closeRunMenu();orderCostsTemplate(false)" title="Every order in this window, with the cost the app holds. Fill in 'cost' and upload it back."><i class="ti ti-download"></i> Cost sheet</button>
            <button onclick="closeRunMenu();orderCostsTemplate(true)" title="Only orders with no cost yet."><i class="ti ti-download"></i> Cost sheet · uncosted only</button>
            <button onclick="closeRunMenu();orderCostsUploadOpen()" title="Rows left blank are skipped, so an unedited file changes nothing."><i class="ti ti-file-upload"></i> Upload costs</button>
            <div class="tmsep"></div>
            <button onclick="closeRunMenu();trackingTemplate(false)" title="Every order in this window, with any tracking already recorded."><i class="ti ti-download"></i> Tracking sheet</button>
            <button onclick="closeRunMenu();trackingTemplate(true)" title="Only orders with no tracking yet."><i class="ti ti-download"></i> Tracking sheet · untracked only</button>
            <button onclick="closeRunMenu();trackingUploadOpen()" title="Rows left blank are skipped, so an unedited file changes nothing."><i class="ti ti-file-upload"></i> Upload tracking</button>
          </template>
          <input type="file" id="ordcost_file" accept=".csv,.tsv,.txt,.xlsx,.xls"
                 style="display:none" onchange="orderCostsUpload(this)">
          <input type="file" id="ordtrack_file" accept=".csv,.tsv,.txt,.xlsx,.xls"
                 style="display:none" onchange="trackingUpload(this)">
          <button class="db-chip" id="ord_trackcheck" onclick="trackingCheck()"
                  title="Ask the carrier where each parcel is now. Needs a tracking service key in Settings — without one, nothing is checked and it says so rather than showing a made-up status.">
            <i class="ti ti-truck-delivery"></i> Check parcels</button>
          <button class="db-chip" onclick="ordersLoad()"><i class="ti ti-refresh"></i> Refresh</button>
        </div>
      </div>
      <div id="ordcost_result" style="margin:0 0 8px"></div>
      <div id="ordtrack_result" style="margin:0 0 8px"></div>
      <div style="display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin:0 0 10px">
        <div id="ord_days" style="display:flex;gap:4px;flex-wrap:wrap">
          <button class="db-chip" onclick="ordersSetDays(7)">7 days</button>
          <button class="db-chip" onclick="ordersSetDays(30)">30 days</button>
          <button class="db-chip" onclick="ordersSetDays(90)">90 days</button>
        </div>
        <!-- THE PICKER IS GONE, AND SO IS "EVERY ACCOUNT".
             "i do not want that option which enables the user to see all the
              orders on every account by being in 1 account. i am in nestwell
              goods why am i able to see the orders of jack reacherd"
             These are separate limited companies with separate customers, and
             one's orders under another's name is that customer's name and
             address in the wrong company's screen. There is no longer a way to
             ask for it — the endpoint refuses it too, because a rule that only
             exists in the browser is not a rule. -->
        <span class="cc" id="ord_scope" style="font-size:11.5px"
              title="Orders belong to the account you have open. Each account is a separate business with its own customers."><i class="ti ti-lock"></i> this account</span>
        <!-- ON by default, and starts that way: this is what fills the Item
             column with the product, its picture, the margin and the ROI. It
             costs one Amazon call per order, so it runs as a second pass after
             the list is already drawn. Pressing this turns it OFF. -->
        <button class="db-chip on" id="ord_profit" onclick="ordersToggleProfit()"
                title="Read what was in each order and what it earned — the product and its picture, profit, margin and ROI. One Amazon call per order, so it fills in just after the list appears. Press to turn it off.">
          <i class="ti ti-coins"></i> Profit
        </button>
      </div>
      <div id="ordbody" style="padding:4px 0"></div>
    </div>
