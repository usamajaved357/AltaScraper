<!doctype html><html><head><title>Set your password</title>
<!-- The app's own mark, inlined. Same one as dashboard.html; see the note
     there for why the browser asking for a favicon that is not there is
     worth fixing. -->
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232dd4bf'/%3E%3Cpath d='M8.6 24.2 L16 8.2 L23.4 24.2 M12.1 18.6 H19.9' fill='none' stroke='%230a1628' stroke-width='3.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/css/dash_login.css?v={{ ASSET_V }}">
</head><body>
{% if done %}
<form onsubmit="return false">
  <h1>You're all set</h1>
  <div class="ok">Your password is saved and you are signed in.</div>
  <div class="sub"><a href="/">Open AltaScraper</a></div>
</form>
{% else %}
<form method="post">
  <h1>Choose your password</h1>
  <div class="hint">This link works once. Pick a password only you know &mdash;
    nobody else, including the person who invited you, can see it.</div>
  {% if error %}<div class="err">{{ error }}</div>{% endif %}
  <input type="password" name="password"  placeholder="New password" autofocus autocomplete="new-password">
  <input type="password" name="password2" placeholder="Repeat password" autocomplete="new-password">
  <button type="submit">Save and sign in</button>
</form>
{% endif %}
</body></html>
