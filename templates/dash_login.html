<!doctype html><html><head><title>Sign in</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="/static/css/dash_login.css">
</head><body><form method="post">
<h1>Listing Dashboard</h1>
{% if error %}<div class="err">{{ error if error is string else "Wrong password." }}</div>{% endif %}
{% if not bootstrap %}
<input type="email" name="email" placeholder="Email" autofocus autocomplete="username">
<input type="password" name="password" placeholder="Password" autocomplete="current-password">
{% else %}
<input type="password" name="password" placeholder="Password" autofocus autocomplete="current-password">
{% endif %}
{% if next %}<input type="hidden" name="next" value="{{ next }}">{% endif %}
<button type="submit">Sign in</button>
</form></body></html>
